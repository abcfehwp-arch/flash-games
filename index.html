<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container > object, 
        #game-container > embed,
        #game-container > ruffle-player {
            width: 100% !important;
            height: 100% !important;
        }
        #fs-btn {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #e67e22;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 9999;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
        }
        #fs-btn:hover {
            background: #d35400;
        }
    </style>
</head>
<body>
    <a id="fs-btn" href="index.html" target="_blank">Full Screen</a>
    <div id="game-container"></div>

    <!-- Load Ruffle Emulator -->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            document.getElementById("game-container").appendChild(player);
            player.load("bloxors.swf");
        });
    </script>
</body>
</html>
